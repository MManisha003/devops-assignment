# Pipeline for Bicep Infrastructure deployment

trigger: none
name: 'Infrastructure-Deployment-$(Date:yyyyMMdd)$(Rev:.r)'

stages:

- stage: DEV_Infrastructure_Validation
  displayName: 'Validate Infrastructure'
  jobs:
  - template: ../Templates/build.template.infrastructure.yml
    parameters:
      azureSubscription: 'devops-assignment-conn'
      location: 'westus'
      environment: 'dev'

- stage: DEV_Infrastructure_Deployment
  displayName: 'Deploy Infrastructure'
  dependsOn: DEV_Infrastructure_Validation
  jobs:
  #------------Approvals-----------------------#
  - deployment: DEV
    pool: 'Default'
    environment: DEV_INFRA_APPROVAL
  #---------------------------------------------#
  - template: ../Templates/release.template.infrastructure.yml
    parameters:
      azureSubscription: 'devops-assignment-conn'
      location: 'westus'
      environment: 'dev'

- stage: PROD_Infrastructure_Validation
  displayName: 'Validate Infrastructure'
  jobs:
  - template: ../Templates/build.template.infrastructure.yml
    parameters:
      azureSubscription: 'devops-assignment-conn'
      location: 'westus'
      environment: 'prod'

- stage: PROD_Infrastructure_Deployment
  displayName: 'Deploy Infrastructure'
  dependsOn: PROD_Infrastructure_Validation
  jobs:
  #------------Approvals-----------------------#
  - deployment: PROD
    pool: 'Default'
    environment: PROD_INFRA_APPROVAL
  #---------------------------------------------#
  - template: ../Templates/release.template.infrastructure.yml
    parameters:
      azureSubscription: 'devops-assignment-conn'
      location: 'westus'
      environment: 'prod'