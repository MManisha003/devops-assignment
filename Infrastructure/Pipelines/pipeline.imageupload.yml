# Pipeline for Application (Docker → ACR → Web App)

trigger: none

name: 'Image-Deployment-$(Date:yyyyMMdd)$(Rev:.r)'

stages:
- stage: DEV_Build_And_Validate_Image
  displayName: 'DEV Image Validation'
  variables:
    - template: ../Variables/dev.yml
  jobs:
  - template: ../Templates/build.template.imageupload.yml
    parameters:
      imageName: $(imageName)
      dockerfilePath: $(dockerfilePath)
      buildContext: $(buildContext)


- stage: DEV_Push_Image_To_ACR
  displayName: 'DEV Image Upload'
  dependsOn: DEV_Build_And_Validate_Image
  variables:
    - template: ../Variables/dev.yml
  jobs:
  #------------Approvals-----------------------#
  - deployment: DEV
    pool: 'Default'
    environment: DEV_INFRA_APPROVAL
  #---------------------------------------------#
  - template: ../Templates/release.template.imageupload.yml
    parameters:
      containerRegistry: 'devops-assignment-registry' # Use the actual container registry name
      acrName: $(acrName)
      imageName: $(imageName)
      dockerfilePath: $(dockerfilePath)
      buildContext: $(buildContext)

- stage: Approvals
  dependsOn: [DEV_Push_Image_To_ACR]
  jobs:
  #------------Approvals-----------------------#
  - deployment: PROD
    pool: 'Default'
    environment: PROD_INFRA_APPROVAL
  #---------------------------------------------#

- stage: PROD_Push_Image_To_ACR
  displayName: 'PROD Image Upload'
  dependsOn: [Approvals]
  variables:
    - template: ../Variables/prod.yml
  jobs:
  #------------Approvals-----------------------#
  - deployment: PROD
    pool: 'Default'
    environment: PROD_INFRA_APPROVAL
  #---------------------------------------------#
  - template: ../Templates/release.template.imageupload.yml
    parameters:
      containerRegistry: 'devops-assignment-registry'
      acrName: $(acrName)
      imageName: $(imageName)
      dockerfilePath: $(dockerfilePath)
      buildContext: $(buildContext)