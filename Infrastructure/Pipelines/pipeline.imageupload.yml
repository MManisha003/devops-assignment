# Pipeline for Application (Docker → ACR → Web App)

trigger: none

name: 'Image-Deployment-$(Date:yyyyMMdd)$(Rev:.r)'

stages:
- stage: DEV_Build_And_Validate_Image
  displayName: 'Build and Validate Docker Image'
  Variables:
    - template: Variables/dev.yml
  jobs:
  - template: Templates/build.template.imageupload.yml
    parameters:
      imageName: $(imageName)
      dockerfilePath: $(dockerfilePath)
      buildContext: $(buildContext)


- stage: Push_Image_To_ACR
  displayName: 'Push Docker Image to ACR'
  dependsOn: DEV_Build_And_Validate_Image
  variables:
    - template: Variables/dev.yml
  jobs:
  #------------Approvals-----------------------#
  - deployment: DEV
    environment: DEV_INFRA_APPROVAL
  #---------------------------------------------#
  - template: Templates/release.template.imageupload.yml
    parameters:
      azureSubscription: 'devops-assignment-conn'
      acrName: $(acrName)
      imageName: $(imageName)

- stage: PROD_Build_And_Validate_Image
  displayName: 'Build and Validate Docker Image'
  Variables:
    - template: Variables/prod.yml
  jobs:
  - template: Templates/build.template.imageupload.yml
    parameters:
      imageName: $(imageName)
      dockerfilePath: $(dockerfilePath)
      buildContext: $(buildContext)

- stage: Push_Image_To_ACR
  displayName: 'Push Docker Image to ACR'
  dependsOn: PROD_Build_And_Validate_Image
  variables:
    - template: Variables/prod.yml
  jobs:
  #------------Approvals-----------------------#
  - deployment: PROD
    environment: PROD_INFRA_APPROVAL
  #---------------------------------------------#
  - template: Templates/release.template.imageupload.yml
    parameters:
      azureSubscription: 'devops-assignment-conn'
      acrName: $(acrName)
      imageName: $(imageName) 