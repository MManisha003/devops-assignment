# Template to validate Dockerfile and build the application image

parameters:
  imageName: ""
  dockerfilePath: ""
  buildContext: ""

jobs:

- job: BuildApplication
  displayName: 'Build & Validate Docker Image'
  pool:
    name: 'Default'

  steps:

  - task: PowerShell@2
    displayName: "Display Current Job Variables"
    inputs:
      targetType: 'inline'
      script: |
        Get-ChildItem Env: | ForEach-Object { Write-Host "$($_.Name)=$($_.Value)" }

  - script: |
      echo "Validating Dockerfile..."
      if [ ! -f "${{ parameters.dockerfilePath }}" ]; then
        echo "Dockerfile not found!"
        exit 1
      fi
    displayName: 'Validate Dockerfile'

  - script: |
      echo "Building Docker image..."
      docker build \
        -t ${{ parameters.imageName }}:$(Build.BuildId) \
        -f ${{ parameters.dockerfilePath }} \
        ${{ parameters.buildContext }}
    displayName: 'Build Docker Image'


  - script: |
      echo "Cleaning up any existing containers..."
      docker ps -q --filter "publish=8000" | xargs -r docker stop
      docker ps -aq --filter "publish=8000" | xargs -r docker rm

      CONTAINER_NAME=test-container-$(Build.BuildId)

      echo "Running container..."
      docker run -d -p 8000:8000 --name $CONTAINER_NAME \
        ${{ parameters.imageName }}:$(Build.BuildId)

      echo "Waiting for app..."

      for i in {1..10}; do
        if curl -f http://localhost:8000/health; then
          echo "Healthy ✅"
          break
        fi
        sleep 3
      done

      curl -f http://localhost:8000/health || exit 1

      echo "Logs:"
      docker logs $CONTAINER_NAME

      echo "Cleaning up..."
      docker stop $CONTAINER_NAME
      docker rm $CONTAINER_NAME
  displayName: 'Validate Container Health'