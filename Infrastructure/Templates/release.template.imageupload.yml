# Template to push Docker image to Azure Container Registry

parameters:
  azureSubscription: ""
  acrName: ""
  imageName: ""

jobs:

- job: PushImageToACR
  displayName: 'Push Docker Image to ACR'
  pool:
    name: 'Default'

  steps:

  - task: PowerShell@2
    displayName: "Display Current Job Variables"
    inputs:
      targetType: 'inline'
      script: |
        Get-ChildItem Env: | ForEach-Object { Write-Host "$($_.Name)=$($_.Value)" }

  - task: AzureCLI@2
    displayName: 'Login to ACR'
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: pscore
      scriptLocation: 'inlineScript'
      inlineScript: |
        az acr login --name ${{ parameters.acrName }}

  - task: Docker@2
    displayName: Build Image
    inputs:
      containerRegistry: ${{ parameters.azureSubscription }}
      repository: ${{ parameters.imageName }}
      command: 'build'
      Dockerfile: '$(dockerfilePath)'
      buildContext: '$(buildContext)'
      tags: |
        $(Build.BuildId)
        latest

  - task: Docker@2
    displayName: Push Image
    inputs:
      containerRegistry: ${{ parameters.azureSubscription }}
      repository: ${{ parameters.imageName }}
      command: 'push'
      tags: |
        $(Build.BuildId)
        latest